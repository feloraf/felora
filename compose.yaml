services:
  app:
    image: felora/swoole
    container_name: felora
    environment:
      AUTORELOAD_PROGRAMS: "swoole"
      AUTORELOAD_ANY_FILES: 0
    ports:
      - ${PORT:-9501}:${PORT:-9501}
      - ${PORT:-9502}:${PORT:-9502}
      - ${PORT:-9550}:${PORT:-9550}
    volumes:
      - .:/var/www/felora
