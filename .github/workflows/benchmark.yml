name: Felora Benchmark

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !contains(github.event.head_commit.message, 'Merge pull request'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, curl, sockets

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Pull Felora Image
        run: docker pull feloraf/felora:latest

      - name: Start Felora Server
        run: ./felora up &

      - name: Wait for server
        run: sleep 5

      - name: Install wrk
        run: sudo apt-get update && sudo apt-get install -y wrk

      - name: Benchmark with wrk
        run: |
          OUTPUT=$(wrk -t4 -c100 -d20s http://127.0.0.1:9501/json)
          REQ_PER_SEC=$(echo "$OUTPUT" | grep "Requests/sec" | awk '{print $NF}')
          LATENCY_AVG=$(echo "$OUTPUT" | grep "Latency" | head -n 1 | awk '{print $2}' | sed 's/ms//')

          if [ -z "$REQ_PER_SEC" ] || [ -z "$LATENCY_AVG" ]; then
            echo "Failed to parse wrk output"
            exit 1
          fi

          echo "REQ_PER_SEC=$REQ_PER_SEC" >> $GITHUB_ENV
          echo "LATENCY_AVG=$LATENCY_AVG" >> $GITHUB_ENV

          echo "Parsed results:"
          echo "Requests/sec = $REQ_PER_SEC"
          echo "Latency Avg (ms) = $LATENCY_AVG"

      - name: Stop Felora server
        run: ./felora down

      - name: Compare with baseline
        run: |
          BASE_REQ=$(jq '.requests_per_sec' benchmarks/baseline.json)
          BASE_LAT=$(jq '.latency_avg_ms' benchmarks/baseline.json)

          CUR_REQ=$REQ_PER_SEC
          CUR_LAT=$LATENCY_AVG

          REQ_DIFF=$(awk "BEGIN { printf \"%.2f\", (($CUR_REQ - $BASE_REQ) / $BASE_REQ) * 100 }")
          LAT_DIFF=$(awk "BEGIN { printf \"%.2f\", (($CUR_LAT - $BASE_LAT) / $BASE_LAT) * 100 }")

          echo "REQ_DIFF=$REQ_DIFF" >> $GITHUB_ENV
          echo "LAT_DIFF=$LAT_DIFF" >> $GITHUB_ENV

          echo "Baseline Requests/sec: $BASE_REQ"
          echo "Current  Requests/sec: $CUR_REQ"
          echo "Change: $REQ_DIFF %"

          echo "Baseline Latency (ms): $BASE_LAT"
          echo "Current  Latency (ms): $CUR_LAT"
          echo "Change: $LAT_DIFF %"

          if (( $(echo "$CUR_REQ < $BASE_REQ" | bc -l) )); then
            echo "::warning::⚠️ Requests/sec decreased by $REQ_DIFF%"
          else
            echo "✅ Requests/sec OK"
          fi

          if (( $(echo "$CUR_LAT > $BASE_LAT" | bc -l) )); then
            echo "::warning::⚠️ Latency increased by $LAT_DIFF%"
          else
            echo "✅ Latency OK"
          fi

      - name: Report Benchmark to PR
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## ⚡ Felora Benchmark Results

            | Metric | Baseline | Current | Change |
            |--------|---------|---------|--------|
            | Requests/sec | 45000 | ${{ env.REQ_PER_SEC }} | ${{ env.REQ_DIFF }}% |
            | Latency (ms) | 2.17  | ${{ env.LATENCY_AVG }} | ${{ env.LAT_DIFF }}% |

            _Note: Only reporting; CI does not fail on benchmark changes._
