name: Felora Benchmark

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, curl, sockets

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Build Felora
        run: ./felora build

      - name: Start Felora Server
        run: ./felora up &

      - name: Wait for server
        run: sleep 5

      - name: Install wrk
        run: sudo apt-get update && sudo apt-get install -y wrk

      - name: Benchmark with wrk
        run: |
          OUTPUT=$(wrk -t4 -c100 -d20s http://127.0.0.1:9501/json)

          echo "$OUTPUT"

          REQ_PER_SEC=$(echo "$OUTPUT" | grep "Requests/sec" | awk '{print $2}')
          LATENCY_AVG=$(echo "$OUTPUT" | grep "Latency" | head -n 1 | awk '{print $2}' | sed 's/ms//')

          echo "Parsed results:"
          echo "Requests/sec = $REQ_PER_SEC"
          echo "Latency Avg (ms) = $LATENCY_AVG"

      - name: Stop Felora server
        run: ./felora down

      - name: Compare with baseline
        run: |
          BASE_REQ=$(jq '.requests_per_sec' benchmarks/baseline.json)
          BASE_LAT=$(jq '.latency_avg_ms' benchmarks/baseline.json)

          CUR_REQ=$REQ_PER_SEC
          CUR_LAT=$LATENCY_AVG

          REQ_DIFF=$(awk "BEGIN { printf \"%.2f\", (($CUR_REQ - $BASE_REQ) / $BASE_REQ) * 100 }")
          LAT_DIFF=$(awk "BEGIN { printf \"%.2f\", (($CUR_LAT - $BASE_LAT) / $BASE_LAT) * 100 }")

          echo "Baseline Requests/sec: $BASE_REQ"
          echo "Current  Requests/sec: $CUR_REQ"
          echo "Change: $REQ_DIFF %"

          echo "Baseline Latency (ms): $BASE_LAT"
          echo "Current  Latency (ms): $CUR_LAT"
          echo "Change: $LAT_DIFF %"

          if awk "BEGIN {exit !($CUR_REQ < $BASE_REQ)}"; then
            echo "⚠️ Requests/sec decreased"
          else
            echo "✅ Requests/sec OK"
          fi

          if awk "BEGIN {exit !($CUR_LAT > $BASE_LAT)}"; then
            echo "⚠️ Latency increased"
          else
            echo "✅ Latency OK"
          fi
